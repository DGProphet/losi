[package]
name = "losi"
version = "0.1.0"
edition = "2021"
authors = ["DGProphet"]
description = "Modern LiteStep - Desktop customization engine for Windows 11"
repository = "https://github.com/DGProphet/losi"
license = "MIT"
keywords = ["litestep", "desktop", "customization", "windows11", "shell"]

[dependencies]
# Core & Async
clap = { version = "4.4", features = ["derive", "cargo"] }
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Configuration & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }

# Windows-specific
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "winreg", "shellapi", "dwmapi", "winnt", "windef", "handleapi", "processthreadsapi"] }
windows = { version = "0.51", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
regex = "1.10"

# File operations & Shell
walkdir = "2.4"
dirs = "5.0"
tempfile = "3.8"
shellexpand = "3.1"

# Graphics & Image handling
image = "0.24"

# Process management
nix = { version = "0.27", features = ["process", "signal"] }

# Async utilities
futures = "0.3"
parking_lot = "0.12"

# Hot reload for config files
notify = "6.1"

[features]
default = ["explorer-integration"]
explorer-integration = []
shell-replacement = []

[[bin]]
name = "losi"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
